[project]
name = "ai-music-detector"
version = "0.1.0"
description = "Learning to inspect audio before building a music classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "soundfile>=0.13,<0.14",
    "matplotlib>=3.10,<4",
    "scipy>=1.16,<2",
    "librosa>=0.11,<0.12",
    "scikit-learn>=1.9,<1.10",
    "streamlit>=1.56,<2",
    "torch==2.14.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
encoder-build = [
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
